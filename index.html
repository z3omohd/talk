<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>خواطر هادئة</title>
 
 <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;500&display=swap" rel="stylesheet">

 <style>
 :root {
 --bg-color: #0f172a;
 --card-bg: rgba(30, 41, 59, 0.75);
 --text-main: #f8fafc;
 --text-muted: #94a3b8;
 --accent: #38bdf8;
 --border-color: rgba(255, 255, 255, 0.1);
 }

 * {
 box-sizing: border-box;
 margin: 0;
 padding: 0;
 font-family: 'Tajawal', sans-serif;
 }

 body {
 background-color: var(--bg-color);
 color: var(--text-main);
 min-height: 100vh;
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: center;
 padding: 20px;
 background-image: radial-gradient(circle at 50% 30%, #1e293b 0%, #0f172a 100%);
 }

 .container {
 width: 100%;
 max-width: 600px;
 background: var(--card-bg);
 backdrop-filter: blur(12px);
 -webkit-backdrop-filter: blur(12px);
 border: 1px solid var(--border-color);
 border-radius: 20px;
 padding: 40px 30px;
 box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
 text-align: center;
 }

 .thought-box {
 min-height: 160px;
 display: flex;
 align-items: center;
 justify-content: center;
 margin-bottom: 25px;
 padding: 0 10px;
 }

 p.thought-text {
 font-family: 'Amiri', serif;
 font-size: 1.5rem;
 line-height: 2.2;
 color: var(--text-main);
 transition: opacity 0.8s ease;
 }

 p.fade-out {
 opacity: 0;
 }

 .controls {
 display: flex;
 flex-direction: column;
 align-items: center;
 gap: 15px;
 margin-top: 20px;
 border-top: 1px solid var(--border-color);
 padding-top: 20px;
 }

 /* شريط الصوت بشفافية 90% */
 audio {
 width: 100%;
 max-width: 300px;
 height: 40px;
 border-radius: 20px;
 outline: none;
 opacity: 0.9;
 filter: invert(90%) hue-rotate(180deg);
 }

 footer {
 margin-top: 30px;
 font-size: 0.75rem;
 color: var(--text-muted);
 }
 </style>
</head>
<body>

 <div class="container">
 <div class="thought-box">
 <p id="thoughtText" class="thought-text">"تجاهل آلاف الأيادي صافحتك عند الوصول وابحث عن يد نهضت بك عند تعثرك."</p>
 </div>

 <div class="controls">
 <!-- شريط الصوت الشفاف -->
 <audio controls loop>
 <source src="./music.mp3" type="audio/mp3">
 متصفحك لا يدعم المشغل الصوتي.
 </audio>
 </div>
 </div>

 <footer>Abu-Wasan-THOUGHTS &copy; 2026</footer>

 <script>
 const thoughts = [ "تجاهل آلاف الأيادي صافحتك عند الوصول وابحث عن يد نهضت بك عند تعثرك.", "يحميك الله بنواياك الصادقة.", "تعلم الاكتفاء؛ فما تملك قليل الماء ينقذك وكثيرة يغرقك.", "مهما بلغت ثقتك بالآخرين، لا تفتح لهم إلا غرفة الضيوف.", "مارسوا تجاربكم على كل شيء، إلا مشاعر الآخرين فهي محرمة.", "الشخص الذي تراه صعباً غالباً لا يرتاح معك.", "الوقاحة أن تنسى الفعل وتحاسب على ردة الفعل.", "كل الخسائر قابلة للتعويض إلا خسارة أيامك بالبحث عن رضا الناس.", "لقد سرقوا مني كل شيء تقريبا، وأعطيتهم الباقي من تلقاء نفسي.. (رواية للمهرج).", "الحياة لا تبدأ بالولادة بل بالوعي، ولا تنتهي بالموت بل بانطفاء الروح.", "يتغير الناس لسببين: حينما يتعلم أكثر مما يريد، أو يتأذى أكثر مما يستحق.", "أغمضتها كي لا تفيض فأمطرت.",
 "تجاهل النواقص في من تحب.", "قد تكون الحقيقة ظاهرة لك من البداية ولكن يعز عليك تصديقها.", "لا يتألم إلا الأوفياء.",
 "يموت الفقير وفي عزاءه تذبح كل الخراف..", "من الصعب التعايش من أناس يرون أنفسهم دائماً على حق.", "ما كان من نصيبك لن يذهب لغيرك.", "الزمن لا يتغير، الزمن يكشف.",
 "الاهتمام فقط من قلب يخاف غيابك.", "الأشياء التي يكشفها الله لك إياك أن تبحث لها عن مبررات.", "تصبح حياتك أجمل عندما لا أحد يعلم شي عنك.", "القلب أبصر من العين.", "أكرم ضيفك وإن كان حقيراً.", "من كسب نفسه لايضر ما خسر.", "الذهن المضطرب يجعل الوسادة غير مريحة.", "برقة الاحساس قد تضيع ايامك.",
 "الماضي عبارة عن مرجع وليس محل اقامة.", "الرُّقي أن تعرف ماذا تقول ومتى تقوله ومتى تتوقف.", "بؤسك لايبرر لك افساد سعادة غيرك.", "إرهاق النفس بالتبرير يجعلها تقبل بخطيئة ليست لها.", "فرصة ضائعة لانها لم تكن لك منذ البداية.", "السقوط مسموح والنهوض واجب.",
 "عندما يتكلم المال يصمت الصدق.", "لا تجعل جوع الحب يجعلك تأكل من قمامة العلاقات.", "نظرات الحب الحقيقة في المستشفيات والمقابر، نحن أناس لا نتذكر من نحبهم إلا في النهاية.", "الاحتياج يلين القاسي، والاكتفاء يقسي اللين.", "قد يكرهك البعض بسبب حضورك الطاغي يلغي وجودهم.", "حشد العقلاء أمر معقد للغاية.. أما حشد القطيع فلا يحتاج سوى راعي وكلب..", "لا أجيد الشخصية الجادة التي لا تعرف السماح ولا المزاح.", "هزمني انتصاري عليك.", "الحكيم يغفر إساءة الجاهل.", "من تركنا في وسط الغابة لا يححق له ان يسأل عما فعلت الذئاب بنا.", "ان لم تمشي اليوم ستضطر للركض غداً.",
 "الحياة تبدأ من اليأس.",
 "لا تبالغ بوضوحك في عالم أعمى..",
 "ليست الحياة الا وداع مستمر.",
 "لم تعد صديقي منذ ان اصبحتي اخفي عنك حزني.", "النضج لايكون بالعمر قد تكون ليلة واحدة كفيلة بذلك.", "من الاشياء المزعجة الشخص الصادق يخسر دائماً.", "لايمكن ان تشفى في بيئة جعلتك مريضاً.", "الكوخ الذي تضحك فيه المرأة خير من القصر الذي تبكي فيه." ];

 let currentIndex = 0;
 const textElement = document.getElementById('thoughtText');

 // آلية سرد تلقائي تتغير العبارة كل 7 ثوانٍ بسلاسة تامة بدون أي أزرار function autoNarrate() {
 textElement.classList.add('fade-out');
 setTimeout(() => {
 currentIndex = (currentIndex + 1) % thoughts.length;
 textElement.innerText = `"${thoughts[currentIndex]}"`;
 textElement.classList.remove('fade-out');
 }, 800);
 }

 // تشغيل السرد التلقائي كل 7 ثوانٍ setInterval(autoNarrate, 7000);
 </script>
</body>
</html>
