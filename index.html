<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>خواطر هادئة</title>
 
 <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;500&display=swap" rel="stylesheet">

 <style>
 :root {
 --bg-color: #0f172a;
 --card-bg: rgba(30, 41, 59, 0.75);
 --text-main: #f8fafc;
 --text-muted: #94a3b8;
 --accent: #38bdf8;
 --border-color: rgba(255, 255, 255, 0.1);
 }

 * {
 box-sizing: border-box;
 margin: 0;
 padding: 0;
 font-family: 'Tajawal', sans-serif;
 }

 body {
 background-color: var(--bg-color);
 color: var(--text-main);
 min-height: 100vh;
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: center;
 padding: 20px;
 background-image: radial-gradient(circle at 50% 30%, #1e293b 0%, #0f172a 100%);
 user-select: none;
 }

 .container {
 width: 100%;
 max-width: 600px;
 background: var(--card-bg);
 backdrop-filter: blur(12px);
 -webkit-backdrop-filter: blur(12px);
 border: 1px solid var(--border-color);
 border-radius: 20px;
 padding: 40px 30px;
 box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
 text-align: center; cursor: pointer; /* للإشارة إلى أن البطاقة تفاعلية */ transition: transform 0.2s ease;
 }

 .container:active {
 transform: scale(0.99);
 }

 .thought-box {
 min-height: 150px;
 display: flex;
 align-items: center;
 justify-content: center;
 margin-bottom: 25px;
 }

 p.thought-text {
 font-family: 'Amiri', serif;
 font-size: 1.6rem;
 line-height: 2.2;
 color: var(--text-main);
 transition: opacity 0.5s ease;
 }

 p.fade-out {
 opacity: 0;
 }

 .controls {
 display: flex;
 justify-content: center;
 align-items: center;
 gap: 15px;
 margin-top: 20px;
 border-top: 1px solid var(--border-color);
 padding-top: 20px;
 }

 button {
 background: rgba(56, 189, 248, 0.1);
 border: 1px solid var(--accent);
 color: var(--accent);
 padding: 10px 25px;
 border-radius: 30px;
 font-size: 0.95rem;
 cursor: pointer;
 transition: all 0.3s ease;
 font-family: 'Tajawal', sans-serif;
 }

 button:hover {
 background: var(--accent);
 color: var(--bg-color);
 box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
 }

 /* إخفاء مشغل الصوت كلياً */
 .hidden-audio {
 display: none;
 }

 .music-status {
 font-size: 0.75rem;
 color: var(--text-muted);
 margin-top: 15px;
 letter-spacing: 0.5px;
 }

 footer {
 margin-top: 30px;
 font-size: 0.75rem;
 color: var(--text-muted);
 }
 </style>
</head>
<body>

 <div class="container" onclick="handleCardClick(event)">
 <div class="thought-box">
 <p id="thoughtText" class="thought-text">"تأتي السعادة أحياناً على شكل هدوء، كوب قهوة دافئ، وخاطرة تعيد ترتيب ما أبعثره زحام الأيام."</p>
 </div>

 <div class="controls">
 <!-- زر الخاطرة فقط هو الظاهر -->
 <button onclick="event.stopPropagation(); nextThought();"> الخاطرة التالية</button>
 </div> <div id="musicStatus" class="music-status">انقر في أي مكان على البطاقة لتشغيل الموسيقى </div> </div>

 <footer>WASAN THOUGHTS &copy; 2026</footer>

 <!-- ملف الصوت المخفي -->
 <audio id="bgMusic" class="hidden-audio" preload="auto" loop>
 <source src="./music.mp3" type="audio/mp3">
 </audio>

 <script>
 const thoughts = [ "تأتي السعادة أحياناً على شكل هدوء، كوب قهوة دافئ، وخاطرة تعيد ترتيب ما أبعثره زحام الأيام.", "وفي زحمة الحياة، ما أجمَل أن نلتقي بقلوب تدرك معنى الوصل دون إكراه، وتكتفي بأن تكون خيراً لا يزول.", "للسكون لغة لا يفهمها إلا من ملّ صخب التفاصيل.. هنيئاً لمن وجد راحته في عزلته الجميلة.", "سلامٌ على العابرين الذين تركوا أثراً طيباً، وعلى الكلمات الناعمة التي دملت جرحاً دون أن تشعر.", "الأيام اللطيفة تبدأ من إشراقة فكر هادئ، واقتناع تام بأن ما كتبه الله هو أجمل ما قد يكون." ];

 let currentIndex = 0;
 const textElement = document.getElementById('thoughtText');

 function nextThought() {
 textElement.classList.add('fade-out');
 setTimeout(() => {
 currentIndex = (currentIndex + 1) % thoughts.length;
 textElement.innerText = `"${thoughts[currentIndex]}"`;
 textElement.classList.remove('fade-out');
 }, 300);
 }

 const music = document.getElementById('bgMusic');
 const musicStatus = document.getElementById('musicStatus');
 let isPlaying = false;

 // النقر على البطاقة (خارج زر الخاطرة التالية) يشغل أو يوقف الموسيقى بسلاسة function handleCardClick(event) {
 if (isPlaying) {
 music.pause();
 musicStatus.innerText = "انقر على البطاقة لاستئناف الموسيقى ";
 isPlaying = false;
 } else {
 music.play().then(() => {
 musicStatus.innerText = "الموسيقى تعمل في الخلفية ";
 isPlaying = true;
 }).catch(error => {
 musicStatus.innerText = "تعذر تشغيل الصوت";
 });
 }
 }
 </script>
</body>
</html>
